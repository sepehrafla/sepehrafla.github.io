<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="DRIFT/DOCK — an FPV drone game of flow and precision." />
    <title>DRIFT/DOCK</title>
  </head>
  <body>
    <main id="game" aria-label="DRIFT/DOCK, an FPV drone flight game">
      <!-- Attitude ladder: a horizon line referenced to true world-level,
           shown through the tilt-coupled camera exactly like a real FPV
           OSD -- rotates by roll, shifts by pitch. -->
      <div id="ladder-wrap" class="ladder-wrap"><div id="ladder" class="ladder"><i></i></div></div>
      <!-- Velocity vector: where the drone is actually GOING, projected
           into screen space -- distinct from where the nose points once
           tilt-coupling is in play. The brief calls this the single most
           important instrument. -->
      <div id="vel-vector" class="vel-vector hide"></div>
      <div id="hud" class="hud hide">
        <div class="row"><span class="label">SPD</span><b id="speed">0.0</b><span class="unit">m/s</span></div>
        <div class="row"><span class="label">ALT</span><b id="alt">0.0</b><span class="unit">m</span></div>
        <div class="row"><span class="label">THR</span><b id="throttle">50</b><span class="unit">%</span></div>
        <div class="row"><span class="label">TIER</span><b id="tier" class="small">STAB (keyboard)</b></div>
        <div class="row"><span class="label">FA</span><b id="assist">OFF</b></div>
        <div class="assist-cost" id="assist-cost"></div>
        <div class="hint">W/S pitch · A/D roll · ←/→ yaw · ↑/↓ throttle · F cycle assist · R restart · gamepad auto-detected for true-acro tier</div>
      </div>
      <p id="fallback" class="fallback"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
