<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f3e9">
<meta name="description" content="A playful, personal Spanish practice space for vocabulary, grammar, verbs, and everyday conversation.">
<title>¡Aprende Español! — Práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1226; --panel:#1a1f3d; --panel2:#232a52; --line:rgba(255,255,255,.1);
    --txt:#f3f4fb; --muted:#a6acd6; --accent:#ff5d8f; --accent2:#5b8cff;
    --good:#3ddc97; --bad:#ff6b6b; --warn:#ffcf5c; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:
    radial-gradient(1200px 600px at 10% -10%,#2a2160 0%,transparent 60%),
    radial-gradient(1000px 500px at 100% 0%,#1d3a6e 0%,transparent 55%),
    var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}
  .wrap{max-width:920px;margin:0 auto;padding:24px 18px 80px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .brand .logo{font-size:30px}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .brand p{font-size:12px;color:var(--muted)}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center}
  .pill b{color:var(--txt)}
  .hide{display:none!important}

  /* HOME */
  .hero{background:linear-gradient(135deg,#ff5d8f22,#5b8cff22);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:26px}
  .hero h2{font-size:24px;margin-bottom:6px}
  .hero p{color:var(--muted);font-size:15px}
  .section-title{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:26px 4px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-4px);border-color:var(--accent2)}
  .card .emoji{font-size:34px;display:block;margin-bottom:10px}
  .card h3{font-size:18px;margin-bottom:5px}
  .card p{font-size:13px;color:var(--muted)}
  .card .bar{height:6px;border-radius:999px;background:var(--panel2);margin-top:14px;overflow:hidden}
  .card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--accent2));width:0}
  .card .tag{position:absolute;top:14px;right:14px;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
  .card.special{background:linear-gradient(135deg,#ff5d8f33,#7b5bff33);border-color:#ff5d8f55}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 18px;font-size:15px;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{border-color:var(--accent2)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#ff7eaa);border:none;font-weight:600}
  .btn.ghost{background:transparent}
  .btn:active{transform:scale(.97)}
  .back{color:var(--muted);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:18px}
  .back:hover{color:var(--txt)}

  /* MODE SELECT */
  .modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
  .mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;cursor:pointer;transition:.15s;text-align:center}
  .mode:hover{transform:translateY(-3px);border-color:var(--accent)}
  .mode .ic{font-size:30px;margin-bottom:8px}
  .mode h4{font-size:16px;margin-bottom:4px}
  .mode p{font-size:12px;color:var(--muted)}

  /* QUIZ */
  .quizbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px 26px;margin-top:8px}
  .progressrow{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .progressrow .track{flex:1;height:8px;background:var(--panel2);border-radius:999px;overflow:hidden}
  .progressrow .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s}
  .progressrow .qn{font-size:13px;color:var(--muted);white-space:nowrap}
  .context{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:10px}
  .prompt{font-size:24px;font-weight:600;margin-bottom:8px;line-height:1.4}
  .translation{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:22px}
  .blank{display:inline-block;min-width:120px;border-bottom:3px solid var(--accent2);color:var(--accent2);text-align:center;padding:0 6px}
  input.answer{font-size:20px;font-family:inherit;background:var(--panel2);border:2px solid var(--line);border-radius:12px;color:var(--txt);padding:12px 16px;width:100%;max-width:340px;outline:none}
  input.answer:focus{border-color:var(--accent2)}
  input.answer.correct{border-color:var(--good);color:var(--good)}
  input.answer.wrong{border-color:var(--bad);color:var(--bad)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .opt{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:15px;font-size:17px;cursor:pointer;text-align:center;transition:.12s;font-family:inherit;color:var(--txt)}
  .opt:hover:not(:disabled){border-color:var(--accent2)}
  .opt.correct{border-color:var(--good);background:#3ddc9722;color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:#ff6b6b22;color:var(--bad)}
  .opt:disabled{cursor:default}
  .feedback{min-height:26px;margin:20px 0 4px;font-size:16px;font-weight:600}
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}
  .qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
  .swatch{width:100%;height:90px;border-radius:12px;margin-bottom:20px;border:1px solid var(--line)}

  /* MATCH */
  .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:10px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mitem{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:16px;cursor:pointer;text-align:center;transition:.12s}
  .mitem:hover{border-color:var(--accent2)}
  .mitem.sel{border-color:var(--accent);background:#ff5d8f22}
  .mitem.done{border-color:var(--good);background:#3ddc9722;color:var(--good);cursor:default;opacity:.65}
  .mitem.flash{border-color:var(--bad);background:#ff6b6b22}

  /* RESULTS */
  .results{text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:40px 26px}
  .results .big{font-size:64px;margin-bottom:8px}
  .results h2{font-size:26px;margin-bottom:6px}
  .results .score{font-size:46px;font-weight:700;background:linear-gradient(135deg,var(--good),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0}
  .results p{color:var(--muted);margin-bottom:24px}
  .rbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* confetti */
  .confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:999;pointer-events:none;border-radius:2px}

  /* verbs tense pills */
  .tenses{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tbtn{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
  .tbtn.active{background:var(--accent);color:#fff;border-color:transparent}
  @media(max-width:560px){.matchgrid{gap:14px}.prompt{font-size:20px}.brand p{display:none}}
  .reel-speak-inline{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:999px;width:26px;height:26px;font-size:13px;cursor:pointer;vertical-align:middle;margin-left:4px}
  .reel-speak-inline:hover{background:var(--accent2)}

  /* ===== REELS ===== */
  #reels-overlay{position:fixed;inset:0;z-index:1000;background:#000;display:none}
  #reels-overlay.on{display:block}
  .reel-scroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .reel-scroll::-webkit-scrollbar{display:none}
  .reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:70px 22px 96px;position:relative;color:#fff;text-align:center}
  .reel-cat{position:absolute;top:58px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;opacity:.9;font-weight:600}
  .reel-speak{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;width:46px;height:46px;font-size:20px;cursor:pointer;margin-bottom:14px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .reel-speak:active{transform:scale(.92)}
  .reel-en{font-size:16px;opacity:.92;font-style:italic;margin-bottom:16px;max-width:440px;line-height:1.4}
  .reel-prompt{font-size:30px;font-weight:700;line-height:1.35;margin-bottom:30px;max-width:500px;text-shadow:0 2px 16px rgba(0,0,0,.3)}
  .reel-big{font-size:74px}
  .reel-blank{display:inline-block;min-width:80px;border-bottom:4px solid rgba(255,255,255,.9);padding:0 8px}
  .reel-swatch{width:150px;height:150px;border-radius:26px;margin-bottom:26px;box-shadow:0 10px 36px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.6)}
  .reel-opts{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
  .reel-opt{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:16px;padding:16px;font-size:19px;font-weight:600;cursor:pointer;transition:.13s;font-family:inherit;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .reel-opt:hover:not(:disabled){background:rgba(255,255,255,.3);transform:scale(1.02)}
  .reel-opt:active{transform:scale(.97)}
  .reel-opt.correct{background:#fff;color:#168a48;border-color:#fff}
  .reel-opt.wrong{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.5);opacity:.55;text-decoration:line-through}
  .reel-opt:disabled{cursor:default}
  .reel-fb{min-height:30px;height:30px;margin-top:18px;font-size:21px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.3)}
  /* Typed production card */
  .reel-typebox{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
  .reel-type-input{width:100%;font-size:22px;font-family:inherit;text-align:center;padding:15px 16px;border-radius:16px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);outline:none}
  .reel-type-input::placeholder{color:rgba(255,255,255,.55)}
  .reel-type-input:focus{border-color:#fff;background:rgba(255,255,255,.22)}
  .reel-typebox.good .reel-type-input{border-color:#fff;background:#fff;color:#168a48;font-weight:700}
  .reel-typebox.bad .reel-type-input{border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.28);opacity:.7;text-decoration:line-through}
  .reel-accents{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .accent-btn{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;width:38px;height:38px;font-size:17px;font-family:inherit;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .accent-btn:active{transform:scale(.92)}
  .r-check-btn{background:rgba(255,255,255,.9);color:#111;border:none;border-radius:16px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit}
  .r-check-btn:disabled{opacity:.5;cursor:default}
  .reel-up{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:14px;opacity:0;transition:.3s;font-weight:600}
  .reel-up.show{opacity:.95;animation:bob 1.3s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .reel-top{position:absolute;top:0;left:0;right:0;z-index:1002;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;color:#fff;font-size:16px;font-weight:700}
  .reel-x{font-size:22px;cursor:pointer;background:rgba(0,0,0,.25);border:none;color:#fff;width:38px;height:38px;border-radius:50%;line-height:1}
  .reel-rail{position:absolute;right:14px;bottom:104px;z-index:1002;display:flex;flex-direction:column;gap:22px;align-items:center;color:#fff}
  .reel-rail .ra{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:12px;font-weight:700}
  .reel-rail .ra .ic{font-size:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
  .reel-xpfloat{position:absolute;right:26px;bottom:160px;color:#fff;font-size:30px;font-weight:800;z-index:1003;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.4);animation:floatup 1s ease-out forwards}
  @keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
  @media(max-width:560px){.reel-prompt{font-size:25px}.reel-big{font-size:60px}}
</style>
<style>
  /* 2026 visual refresh — warm, tactile, and focused */
  :root{
    --bg:#f7f3e9;--panel:#fffdf8;--panel2:#f1ecdf;--line:#ddd6c7;
    --txt:#19352f;--muted:#6d7c75;--accent:#ed654b;--accent2:#176b5b;
    --good:#16866f;--bad:#c9483c;--warn:#f3b742;--radius:22px;
    --ink:#19352f;--cream:#f7f3e9;--coral:#ed654b;--green:#176b5b;
    --lime:#c8da72;--sun:#f7c95c;--blue:#7ec9c3;
    --shadow:0 18px 55px rgba(25,53,47,.09);--shadow-sm:0 8px 24px rgba(25,53,47,.07);
  }
  *{-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{font-family:"DM Sans",sans-serif;background:
    radial-gradient(circle at 2% 1%,rgba(247,201,92,.22),transparent 22rem),
    radial-gradient(circle at 98% 18%,rgba(126,201,195,.17),transparent 26rem),var(--bg);
    color:var(--txt);overflow-x:hidden}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;z-index:-1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.09'/%3E%3C/svg%3E")}
  button,input{font:inherit}
  .wrap{max-width:1180px;padding:22px 28px 96px}

  header.top{margin:0 0 34px;padding:10px 0 18px;border-bottom:1px solid rgba(25,53,47,.12);position:relative;z-index:20}
  .brand{gap:11px}
  .brand .logo{display:grid;place-items:center;width:44px;height:44px;background:var(--green);border-radius:14px;font-size:23px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);transform:rotate(-3deg);transition:.25s ease}
  .brand:hover .logo{transform:rotate(5deg) scale(1.05)}
  .brand h1{font-family:"Fraunces",serif;font-size:21px;letter-spacing:-.45px}
  .brand p{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:700}
  .top-actions{display:flex;align-items:center;gap:12px}
  .nav-link{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;padding:9px 6px;transition:.2s}
  .nav-link:hover{color:var(--green)}
  .pill{background:rgba(255,253,248,.78);border:1px solid var(--line);box-shadow:0 5px 16px rgba(25,53,47,.05);padding:8px 13px;color:var(--muted);gap:10px;font-size:12px;backdrop-filter:blur(12px)}
  .pill b{color:var(--ink)}
  .stat-sep{width:1px;height:17px;background:var(--line)}

  .hero{position:relative;background:var(--green);border:0;border-radius:32px;padding:0;min-height:390px;margin:0 0 46px;overflow:hidden;box-shadow:var(--shadow);color:#fff}
  .hero:before{content:"";position:absolute;width:440px;height:440px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-85px;top:-170px;box-shadow:0 0 0 55px rgba(255,255,255,.035),0 0 0 110px rgba(255,255,255,.025)}
  .home-hero{display:grid;grid-template-columns:1.06fr .94fr;align-items:stretch}
  .hero-copy{padding:52px 24px 48px 54px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);border-radius:999px;text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:700;margin-bottom:20px}
  .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(200,218,114,.15)}
  .hero h2{font-family:"Fraunces",serif;font-size:clamp(40px,5vw,66px);line-height:.98;letter-spacing:-2.7px;max-width:660px;margin:0 0 20px;font-weight:600}
  .hero h2 em{color:var(--lime);font-style:italic}
  .hero p{font-size:16px;line-height:1.65;color:rgba(255,255,255,.74);max-width:520px;margin:0}
  .due-note,.streak-note{font-size:14px;font-weight:700;margin:12px 0 0;color:var(--lime)}
  .streak-note{color:rgba(255,255,255,.78);font-weight:600}
  .hero-actions{display:flex;align-items:center;gap:13px;margin-top:28px;flex-wrap:wrap}
  .hero .btn.primary{background:var(--lime);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(25,53,47,.18),0 10px 28px rgba(0,0,0,.16)}
  .hero .btn.ghost{border-color:rgba(255,255,255,.25);color:#fff}
  .hero .btn.ghost:hover{background:rgba(255,255,255,.08)}
  .hero-visual{position:relative;min-height:390px;display:grid;place-items:center;z-index:2}
  .study-orbit{width:280px;height:280px;border-radius:50%;background:var(--sun);position:relative;display:grid;place-items:center;box-shadow:0 25px 70px rgba(0,0,0,.23);animation:softFloat 5.5s ease-in-out infinite}
  .study-orbit:before{content:"";position:absolute;inset:19px;border-radius:50%;border:1px dashed rgba(25,53,47,.28);animation:slowSpin 28s linear infinite}
  .study-face{font-size:105px;filter:drop-shadow(0 11px 6px rgba(25,53,47,.14));transform:rotate(-4deg)}
  .word-chip{position:absolute;background:var(--panel);color:var(--ink);border:1px solid rgba(25,53,47,.12);border-radius:14px;padding:10px 13px;box-shadow:0 10px 26px rgba(0,0,0,.14);font-size:12px;font-weight:800;white-space:nowrap;animation:chipFloat 4s ease-in-out infinite}
  .word-chip small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
  .chip-one{top:39px;left:-38px;transform:rotate(-7deg)}
  .chip-two{right:-42px;top:95px;animation-delay:-1.4s;transform:rotate(6deg)}
  .chip-three{bottom:23px;left:-19px;animation-delay:-2.8s;transform:rotate(3deg)}
  .spark{position:absolute;color:var(--lime);font-size:27px;animation:twinkle 2.5s ease-in-out infinite}.spark.s1{right:5%;top:14%}.spark.s2{left:5%;bottom:18%;animation-delay:-1.2s;font-size:18px}
  @keyframes softFloat{50%{transform:translateY(-9px) rotate(1deg)}}
  @keyframes chipFloat{50%{translate:0 -8px}}
  @keyframes slowSpin{to{transform:rotate(360deg)}}
  @keyframes twinkle{50%{transform:scale(.65) rotate(18deg);opacity:.45}}

  .home-section{margin-top:46px}
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 4px 18px}
  .section-title{margin:0;color:var(--ink);font-family:"Fraunces",serif;font-size:29px;line-height:1;text-transform:none;letter-spacing:-.7px;font-weight:600}
  .section-kicker{display:block;color:var(--coral);font-family:"DM Sans",sans-serif;text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:800;margin-bottom:9px}
  .section-note{font-size:13px;color:var(--muted)}

/* ============ NUMBER -> SPANISH ============ */
function numToSpanish(n){
  const u=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const tens={30:'treinta',40:'cuarenta',50:'cincuenta',60:'sesenta',70:'setenta',80:'ochenta',90:'noventa'};
  const hund={100:'cien',200:'doscientos',300:'trescientos',400:'cuatrocientos',500:'quinientos',600:'seiscientos',700:'setecientos',800:'ochocientos',900:'novecientos',1000:'mil'};
  if(n<=29) return u[n];
  if(n<100){const t=Math.floor(n/10)*10,r=n%10;return r===0?tens[t]:tens[t]+' y '+u[r];}
  if(n===100) return 'cien';
  if(n<1000){const h=Math.floor(n/100)*100,r=n%100;const hw=h===100?'ciento':hund[h];return r===0?hund[h]:hw+' '+numToSpanish(r);}
  return 'mil';
}

/* ============ STATE & HELPERS ============ */
function ls_get(k,d){ try{ let v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function ls_set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let xp=ls_get('es_xp_v1',0), globalStreak=0;
const $=s=>document.querySelector(s);
const rand=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');

/* ---- daily practice streak (calendar days, separate from the per-answer combo streak) ---- */
function todayStr(){ let d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let dailyData = ls_get('es_daily_v1',{count:0,last:null});
function markDailyPractice(){
  let t=todayStr();
  if(dailyData.last===t) return;
  let y=new Date(Date.now()-86400000), yStr=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  dailyData.count = (dailyData.last===yStr) ? dailyData.count+1 : 1;
  dailyData.last=t;
  ls_set('es_daily_v1',dailyData);
}

function bump(good){ if(good){xp+=10;globalStreak++;} else {globalStreak=0;} ls_set('es_xp_v1',xp); markDailyPractice();
  let hx=$('#hdr-xp'); if(hx)hx.textContent=xp; let hs=$('#hdr-streak'); if(hs)hs.textContent=globalStreak;
  let rs=document.getElementById('reel-streak'); if(rs)rs.textContent=globalStreak;
  let rx=document.getElementById('reel-xp'); if(rx)rx.textContent=xp; }

/* ============ SPACED REPETITION (FSRS) ============
   Falls back to plain randomness (srsReady=false) if the CDN library
   didn't load — reels always work, scheduling is just a bonus layer. */
const srsReady = typeof FSRS !== 'undefined';
const srsSched = srsReady ? FSRS.fsrs() : null;
let srsDB = ls_get('es_srs_v1',{});
function srsSave(){ ls_set('es_srs_v1',srsDB); }
function srsCard(id){
  let raw=srsDB[id];
  return raw ? Object.assign({},raw,{state:raw.state}) : FSRS.createEmptyCard(new Date());
}
function srsIsDue(id){
  if(!srsReady) return true;
  let raw=srsDB[id];
  if(!raw) return true;
  return new Date(raw.due) <= new Date();
}
function srsGrade(id,correct){
  if(!srsReady || !id) return;
  let rating = correct ? FSRS.Rating.Good : FSRS.Rating.Again;
  let result = srsSched.next(srsCard(id), new Date(), rating);
  let c = result.card;
  srsDB[id] = Object.assign({},c,{due:c.due.toISOString(), last_review:c.last_review?c.last_review.toISOString():null});
  srsSave();
}
/* "Due today" badge = items already studied at least once that are now overdue —
   NOT unseen material (which would make a brand-new user's first visit say
   "800 due today", which is really just "everything is new"). */
function srsSeenAndDue(id){
  let raw=srsDB[id];
  return !!raw && new Date(raw.due)<=new Date();
}
function srsDueCount(pool,idFn){
  if(!srsReady) return 0;
  return pool.filter(x=>srsSeenAndDue(idFn(x))).length;
}
/* "Mature" = reviewed at least twice — the pool Fluency Sprint draws from,
   so it's testing speed on things you already know, not new material. */
function srsIsMature(id){
  let raw=srsDB[id];
  return !!raw && raw.reps>=2;
}
function srsIsSeen(id){ return !!srsDB[id]; }
/* Biases toward a priority subset (what's due, or what's mature) most of
   the time, but never restricts to ONLY that subset -- a small due/mature
   pool would otherwise loop the same few cards constantly (this is what
   was happening across all of Reels, not just Sprint: wrong answers get
   rescheduled due again within minutes, so a small cluster of recently-
   missed items could dominate the "due" filter and repeat nonstop). */
function biasedPool(pool,idFn,isPriority,weight){
  let priority=pool.filter(x=>isPriority(idFn(x)));
  if(priority.length && Math.random()<weight) return priority;
  return pool;
}

const jsEsc=s=>(''+s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
let esVoice=null;
function pickSpanishVoice(){
  if(!window.speechSynthesis) return null;
  let voices=speechSynthesis.getVoices();
  if(!voices.length) return null;
  const pref=['Mónica','Monica','Paulina','Jorge','Google español','Microsoft Elvira','Microsoft Alvaro','Microsoft Álvaro','Helena','Sabina','Diego'];
  for(const name of pref){ let v=voices.find(v=>v.name.includes(name)); if(v) return v; }
  return voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('es')) || null;
}
if(window.speechSynthesis){
  esVoice=pickSpanishVoice();
  speechSynthesis.onvoiceschanged=()=>{ esVoice=pickSpanishVoice(); };
}
const audioReady = !!window.speechSynthesis;
function speakEs(text,rate){
  if(!audioReady || !text) return;
  try{
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance((''+text).replace(/[“”]/g,'').replace(/___/g,'...'));
    u.lang='es-ES'; u.rate=rate||0.94;
    if(esVoice) u.voice=esVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

function go(view){
  ['home','lesson','quiz','match','results','verbs','writing','shadow'].forEach(v=>{ let el=$('#view-'+v); if(el) el.classList.add('hide'); });
  $('#view-'+view).classList.remove('hide');
  window.scrollTo(0,0);
}

/* ============ QUIZ ENGINE (fill / mc) ============ */
let quiz=null;
function buildOpts(item,bank){
  if(item.opts) return shuffle(item.opts.slice());
  let pool=[...new Set(bank.map(b=>b.a).filter(a=>a!==item.a))];
  let distract=shuffle(pool).slice(0,3);
  return shuffle([item.a,...distract]);
}
function startQuiz(lesson,mode){
  let items=shuffle(lesson.bank.slice()).slice(0,Math.min(10,lesson.bank.length));
  quiz={lesson,mode,items,i:0,correct:0,answered:false};
  go('quiz'); renderQ();
}
function renderQ(){
  let {items,i,mode,lesson}=quiz;
  let item=items[i];
  quiz.answered=false;
  let pct=Math.round(i/items.length*100);
  let promptHtml=item.p.replace('___',`<span class="blank">?</span>`);
  let body;
  if(mode==='mc'){
    let opts=buildOpts(item,lesson.bank);
    body=`<div class="opts">${opts.map(o=>`<button class="opt" onclick="answerMC(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`;
  } else {
    body=`<input class="answer" id="ans" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type here…">`;
  }
  $('#view-quiz').innerHTML=`
    <div class="back" onclick="openLesson('${lesson.id}')">← Back</div>
    <div class="quizbox">
      <div class="progressrow"><div class="track"><i style="width:${pct}%"></i></div><div class="qn">${i+1} / ${items.length}</div></div>
      <div class="context">${item.t||lesson.title}</div>
      <div class="prompt">${promptHtml}</div>
      <div class="translation">${mode==='fill'?'Hint: '+(item.t||''):''}</div>
      ${body}
      <div class="feedback" id="fb"></div>
      <div class="qfoot">
        <span class="qn">🔥 ${globalStreak} streak</span>
        <button class="btn primary" id="next" onclick="checkOrNext()">Check</button>
      </div>
    </div>`;
  if(mode==='fill'){ let a=$('#ans'); a.focus(); a.addEventListener('keydown',e=>{if(e.key==='Enter')checkOrNext();}); }
}
function showResult(good,ans){
  quiz.answered=true;
  let fb=$('#fb');
  if(good){ quiz.correct++; fb.className='feedback good'; fb.textContent=rand(['¡Correcto! 🎉','¡Exacto! ✨','¡Muy bien! 👏','¡Perfecto! 🌟']); }
  else{ fb.className='feedback bad'; fb.textContent='Answer: '+ans; }
  bump(good);
  // reflect blank
  let blank=$('.prompt .blank'); if(blank){blank.textContent=ans; blank.style.color=good?'var(--good)':'var(--bad)'; blank.style.borderColor=good?'var(--good)':'var(--bad)';}
  $('#next').textContent = (quiz.i+1>=quiz.items.length)?'See results →':'Next →';
}
function answerMC(btn,val){
  if(quiz.answered) return;
  let item=quiz.items[quiz.i];
  let good=val===item.a;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.textContent===item.a) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
    b.disabled=true;
  });
  showResult(good,item.a);
}
function checkOrNext(){
  let item=quiz.items[quiz.i];
  if(!quiz.answered){
    if(quiz.mode==='fill'){
      let a=$('#ans'); if(!a.value.trim())return;
      let good=norm(a.value)===norm(item.a);
      a.classList.add(good?'correct':'wrong'); a.disabled=true;
      showResult(good,item.a);
    }
    return; // mc handled by click
  }
  // next
  quiz.i++;
  if(quiz.i>=quiz.items.length) showResults(quiz.correct,quiz.items.length,()=>startQuiz(quiz.lesson,quiz.mode),quiz.lesson.id);
  else renderQ();
}

/* ============ NUMBER QUIZ (endless) ============ */
let numState=null;
function startNumbers(){ numState={correct:0,total:0,answered:false}; go('quiz'); renderNum(); }
function renderNum(){
  numState.answered=false;
  let big = Math.random()<0.4 ? rand([100,200,300,400,500,600,700,800,900,1000]) : Math.floor(Math.random()*99)+1;
  let answer=numToSpanish(big);
  // distractors
  let opts=new Set([answer]);
  while(opts.size<4){
    let d = big<=100 ? Math.max(0,big+rand([-5,-3,-2,2,3,7,10,-10])) : rand([100,200,300,400,500,600,700,800,900,1000]).valueOf()+rand([0,0,0,1,2]);
    let w=numToSpanish(Math.min(1000,Math.max(0,d))); opts.add(w);
  }
  numState.answer=answer;
  let list=shuffle([...opts]);
  $('#view-quiz').innerHTML=`
    <div class="back" onclick="openLesson('numeros')">← Back</div>
    <div class="quizbox">
      <div class="context">¿Qué número es?</div>
      <div class="prompt" style="font-size:56px;text-align:center;letter-spacing:1px">${big}</div>
      <div class="opts">${list.map(o=>`<button class="opt" onclick="answerNum(this,'${o}')">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="qfoot"><span class="qn">✅ ${numState.correct} / ${numState.total}</span><button class="btn primary" id="next" onclick="renderNum()">Next number →</button></div>
    </div>`;
}
function answerNum(btn,val){
  if(numState.answered)return; numState.answered=true; numState.total++;
  let good=val===numState.answer;
  if(good)numState.correct++;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.textContent===numState.answer)b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
    b.disabled=true;
  });
  let fb=$('#fb'); fb.className='feedback '+(good?'good':'bad'); fb.textContent=good?rand(['¡Correcto! 🎉','¡Exacto! ✨']):'Answer: '+numState.answer;
  bump(good);
}

/* ============ MATCHING GAME ============ */
let match=null;
function startMatch(lesson){
  let pairs=shuffle(lesson.match.slice()).slice(0,Math.min(8,lesson.match.length));
  match={lesson,pairs,selLeft:null,done:0};
  let left=pairs.map((p,idx)=>`<div class="mitem" data-i="${idx}" onclick="pickLeft(${idx})">${p.a}</div>`).join('');
  let rights=shuffle(pairs.map((p,idx)=>({idx,b:p.b})));
  let right=rights.map(r=>`<div class="mitem" data-i="${r.idx}" onclick="pickRight(${r.idx})">${r.b}</div>`).join('');
  $('#view-match').innerHTML=`
    <div class="back" onclick="openLesson('${lesson.id}')">← Back</div>
    <div class="quizbox">
      <div class="context">${lesson.title} — connect the pairs</div>
      <div class="prompt" style="font-size:18px">Tap a word on the left, then its match on the right 🔗</div>
      <div class="matchgrid">
        <div class="mcol" id="mleft">${left}</div>
        <div class="mcol" id="mright">${right}</div>
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  go('match');
}
function pickLeft(i){
  let el=document.querySelector(`#mleft .mitem[data-i="${i}"]`);
  if(el.classList.contains('done'))return;
  document.querySelectorAll('#mleft .mitem').forEach(m=>m.classList.remove('sel'));
  el.classList.add('sel'); match.selLeft=i;
}
function pickRight(i){
  if(match.selLeft===null)return;
  let r=document.querySelector(`#mright .mitem[data-i="${i}"]`);
  let l=document.querySelector(`#mleft .mitem[data-i="${match.selLeft}"]`);
  if(r.classList.contains('done'))return;
  if(i===match.selLeft){
    l.classList.remove('sel'); l.classList.add('done'); r.classList.add('done');
    match.selLeft=null; match.done++; bump(true);
    if(match.done===match.pairs.length){
      $('#fb').className='feedback good'; $('#fb').textContent='¡Completado! 🎉';
      setTimeout(()=>showResults(match.pairs.length,match.pairs.length,()=>startMatch(match.lesson),match.lesson.id),700);
    }
  } else {
    r.classList.add('flash'); l.classList.remove('sel'); match.selLeft=null; bump(false);
    let fb=$('#fb'); fb.className='feedback bad'; fb.textContent='Not a match, try again';
    setTimeout(()=>{r.classList.remove('flash'); fb.textContent='';},500);
  }
}

function showResults(correct,total,retry,lessonId){
  let pct=Math.round(correct/total*100);
  let emoji = pct===100?'🏆':pct>=70?'🎉':pct>=40?'💪':'📚';
  let msg = pct===100?'Perfect score!':pct>=70?'Great job!':pct>=40?'Keep practicing!':'Don\'t give up!';
  $('#view-results').innerHTML=`
    <div class="results">
      <div class="big">${emoji}</div>
      <h2>${msg}</h2>
      <div class="score">${correct} / ${total}</div>
      <p>You earned ${correct*10} XP this round.</p>
      <div class="rbtns">
        <button class="btn primary" onclick="(${retry.toString()})()">Try again 🔄</button>
        <button class="btn" onclick="openLesson('${lessonId}')">Other modes</button>
        <button class="btn ghost" onclick="go('home')">Home</button>
      </div>
    </div>`;
  go('results');
  if(pct>=70) confetti();
}
function confetti(){
  const colors=['#ff5d8f','#5b8cff','#3ddc97','#ffcf5c','#b10dc9'];
  for(let i=0;i<60;i++){
    let c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=rand(colors);
    c.style.transform='rotate('+Math.random()*360+'deg)';
    let dur=2+Math.random()*2;
    c.animate([{top:'-10px',opacity:1},{top:'100vh',opacity:.9}],{duration:dur*1000,easing:'cubic-bezier(.3,.6,.7,1)'});
    document.body.appendChild(c); setTimeout(()=>c.remove(),dur*1000);
  }
}

/* ============ VERB GAME ============ */
let vg=null;
function startVerbs(){ vg={tense:'present',mode:'fill',used:[],answered:false}; go('verbs'); renderVerbShell(); nextVerb(); }
function renderVerbShell(){
  $('#view-verbs').innerHTML=`
    <div class="back" onclick="go('home')">← Home</div>
    <div class="hero"><h2>⚡ Practice Verbs</h2><p>Conjugate the verb inside a real, everyday sentence. Subjects are often dropped — just like people actually talk.</p></div>
    <div class="tenses" id="tenses">
      ${['present','preterite','imperfect','future','conditional','mixed'].map(t=>`<div class="tbtn ${t==='present'?'active':''}" data-tense="${t}" onclick="setTense('${t}')">${t==='mixed'?'🔀 mixed':t}</div>`).join('')}
      <div class="tbtn" id="vmode" onclick="toggleVMode()" style="margin-left:auto">mode: type</div>
    </div>
    <div id="vbox"></div>`;
}
function setTense(t){ vg.tense=t; vg.used=[]; document.querySelectorAll('#tenses .tbtn[data-tense]').forEach(b=>b.classList.toggle('active',b.dataset.tense===t)); nextVerb(); }
function toggleVMode(){ vg.mode=vg.mode==='fill'?'mc':'fill'; $('#vmode').textContent='mode: '+(vg.mode==='fill'?'type':'choose'); nextVerb(); }
function nextVerb(){
  vg.answered=false;
  /* Only pull sentences whose fixed English gloss actually fits the selected
     tense -- otherwise you get grammatically-correct-but-nonsensical drills
     like conjugating "What did you say?" into the conditional. */
  let pool = vg.tense==='mixed' ? VERB_SENTENCES : VERB_SENTENCES.filter(r=>r.tenses.includes(vg.tense));
  if(!pool.length) pool = VERB_SENTENCES;
  if(vg.used.length>=pool.length) vg.used=[];
  let row; do{ row=rand(pool); }while(vg.used.includes(row.es));

  let tense = vg.tense==='mixed' ? rand(row.tenses) : vg.tense;

  let conj=VERBS[row.verb][tense][row.subject];

  let parts=row.es.split('___');

  if(vg.mode==='mc'){
    let forms=Object.values(VERBS[row.verb][tense]);
    let pool=[...new Set(forms.filter(f=>f!==vg.answer))];

    mid=`<span class="blank">?</span>`;
    body=`<div class="opts" style="margin-top:18px">${opts.map(o=>`<button class="opt" onclick="vAnswerMC(this,'${o}')">${o}</button>`).join('')}</div>`;

    mid=`<input class="answer" id="vans" style="max-width:220px;display:inline-block;width:auto;font-size:18px;padding:6px 12px" autocomplete="off" spellcheck="false" placeholder="…">`;

  $('#vbox').innerHTML=`
    <div class="quizbox">
      <div class="context">💬 ${row.context} &nbsp;·&nbsp; <b style="color:var(--txt)">${row.verb}</b> (${VERBS[row.verb].m})${tenseTag}</div>
      <div class="translation" style="margin-bottom:18px">"${row.en}"</div>

      <div id="vspk"></div>
      <div class="qfoot">
        <button class="btn ghost" onclick="vHint()">💡 hint</button>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="vReveal()">show answer</button>
          <button class="btn primary" id="vnext" onclick="vNextOrCheck()">Check</button>
        </div>
      </div>

}
function vSet(good){

const canRecord = !!(navigator.mediaDevices && window.MediaRecorder);
let shadowState=null;
function shadowSentences(){

  });
}
function startShadowing(){
  let pool=shadowSentences();

  go('shadow'); renderShadow();
}
function renderShadow(){
  let s=shadowState, item=s.pool[s.order[s.idx % s.order.length]];
  s.current=item;
  $('#view-shadow').innerHTML=`
    <div class="back" onclick="stopShadowStream();go('home')">← Home</div>
    <div class="hero"><h2>🎙️ Shadowing</h2><p>Listen, say it out loud along with the audio, then record yourself and compare. This is what actually builds pronunciation and rhythm — not just vocabulary.</p></div>
    <div class="quizbox">

      </div>

function nextShadow(){
  let s=shadowState; s.idx++; s.practiced++; ls_set('es_shadow_count',s.practiced);

}
function stopShadowStream(){
  let s=shadowState; if(!s) return;
  if(s.stream) s.stream.getTracks().forEach(t=>t.stop());
  s.recording=false; s.recorder=null; s.stream=null;
}
async function toggleShadowRecord(){
  let s=shadowState, btn=$('#shadow-rec-btn');
  if(s.recording){ s.recorder.stop(); return; }
  try{
    let stream=await navigator.mediaDevices.getUserMedia({audio:true});
    s.stream=stream; s.chunks=[];
    let rec=new MediaRecorder(stream);
    s.recorder=rec; s.recording=true;
    if(btn){ btn.textContent='⏹ Detener'; btn.classList.add('primary'); }
    rec.ondataavailable=e=>{ if(e.data.size>0) s.chunks.push(e.data); };
    rec.onstop=()=>{
      s.recording=false; if(btn){ btn.textContent='🎙️ Grabar mi voz'; btn.classList.remove('primary'); }
      let blob=new Blob(s.chunks,{type:'audio/webm'}), url=URL.createObjectURL(blob);
      let pb=$('#shadow-playback');
      if(pb) pb.innerHTML=`<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Tu grabación — compárala con el audio original:</div><audio controls src="${url}" style="width:100%"></audio>`;
      stream.getTracks().forEach(t=>t.stop());
    };
    rec.start();
  }catch(e){
    let pb=$('#shadow-playback');
    if(pb) pb.innerHTML=`<div style="font-size:13px;color:var(--muted)">No se pudo acceder al micrófono — puedes seguir practicando escuchando y repitiendo en voz alta.</div>`;
  }
}

async function checkWriting(){
  let ta=$('#writing-input'), text=ta.value.trim();
  if(!text || writingState.checking) return;
  writingState.checking=true;
  let btn=$('#writing-check-btn'), result=$('#writing-result');
  btn.disabled=true; btn.textContent='Revisando…';
  result.innerHTML=`<div style="color:var(--muted);margin-top:16px">Comprobando con LanguageTool…</div>`;
  try{
    let res=await fetch('https://api.languagetool.org/v2/check',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'text='+encodeURIComponent(text)+'&language=es'
    });
    let data=await res.json();
    let matches=(data.matches||[]);
    bump(true);
    if(!matches.length){
      result.innerHTML=`<div class="feedback good" style="margin-top:16px">¡Perfecto! 🎉 LanguageTool no encontró ningún error. ¡Muy buen trabajo!</div>`;
    } else {
      let cards=matches.slice(0,12).map(m=>{
        let snippet=text.slice(m.offset,m.offset+m.length);
        let repl=(m.replacements||[]).slice(0,3).map(r=>r.value).filter(Boolean);
        return `<div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px">
          <div><span style="background:rgba(255,109,109,.25);padding:1px 6px;border-radius:6px;font-weight:700">${snippet||'(…)'}</span> ${repl.length?`→ <b style="color:var(--good)">${repl.join(', ')}</b>`:''}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px">${m.message}</div>
        </div>`;
      }).join('');
      result.innerHTML=`<div style="margin-top:16px"><div class="feedback" style="color:var(--warn)">${matches.length} sugerencia${matches.length===1?'':'s'} encontrada${matches.length===1?'':'s'}:</div>${cards}</div>`;
    }
  }catch(e){
    result.innerHTML=`<div class="feedback bad" style="margin-top:16px">No se pudo conectar con el corrector — inténtalo de nuevo en un momento.</div>`;
  }
  writingState.checking=false; btn.disabled=false; btn.textContent='Revisar ✓';
}

function buildPools(){
  VOCAB_POOL=[]; GRAMMAR_POOL=[];
  const vocabLessons=['dias','numeros','adjetivos','descripcion','objetos','lugares','presente','frecuencia','irregulares','raiz','progresivo','reflexivos','gustar','posesivos','objeto','comparativos','mandatos'];
  vocabLessons.forEach(id=>{ let l=LESSONS.find(x=>x.id===id); if(l&&l.match) l.match.forEach(p=>VOCAB_POOL.push({a:p.a,b:p.b,cat:l.title})); });
  EXTRA_VOCAB.forEach(v=>VOCAB_POOL.push(v));
  const grammarLessons=['pronombres','serestar','adjetivos','descripcion','articulos','objetos','lugares','preguntas','presente','frecuencia','irregulares','raiz','progresivo','reflexivos','gustar','posesivos','objeto','comparativos','mandatos','conversa'];
  grammarLessons.forEach(id=>{ let l=LESSONS.find(x=>x.id===id); if(!l||!l.bank) return;
    l.bank.forEach(item=>{

  if(promptEs===item.es) promptEs=item.es.replace(item.blank,'___'); // fallback if the regex didn't match
  if(!sprintMode && Math.random()<0.45){
    return {type:'type',cat:'Oración real',emoji:'📖',en:'"'+item.en+'" — fill in the missing word',prompt:promptEs,answer:item.blank,srsId:id,es:item.es};
  }
  let pool=CLOZE_SENTENCES.map(x=>x.blank).filter(w=>w.toLowerCase()!==item.blank.toLowerCase());
  let opts=shuffle([item.blank,...mcDistract(item.blank,pool)]);
  if(opts.length<4){ let extra=VOCAB_POOL.map(v=>v.b).filter(w=>w!==item.blank); opts=shuffle([item.blank,...mcDistract(item.blank,[...pool,...extra])]); }
  return {cat:'Oración real',emoji:'📖',en:'"'+item.en+'"',prompt:promptEs,opts,answer:item.blank,srsId:id,es:item.es};
}
function makeReelCard(){
  let r=Math.random(), c, hasCloze=CLOZE_SENTENCES.length>0;
  if(reelMode==='sprint'){
    if(r<0.38) c=card_vocab(); else if(r<0.72) c=card_verb(); else c=card_grammar();
  } else if(reelMode==='vocab'){
    if(hasCloze && r<0.16) c=card_cloze();
    else if(r<0.74) c=card_vocab(); else if(r<0.88) c=card_number(); else c=card_color();
  } else {
    if(hasCloze && r<0.18) c=card_cloze();
    else if(r<0.59) c=card_verb(); else c=card_grammar();
  }
  c.bg=rand(REEL_BG); return c;
}
let reelIdx=0; const reelData={}; let reelIO=null, activeReelEl=null, reelMode='vocab';
const ACCENT_CHARS=['á','é','í','ó','ú','ñ','¿','¡'];
function reelCardHTML(cid,c){
  let promptHtml = c.prompt && c.prompt.includes('___') ? c.prompt.replace('___','<span class="reel-blank">?</span>') : c.prompt;
  let esc=o=>(''+o).replace(/'/g,"\\'");
  let body = c.type==='type'
    ? `<div class="reel-typebox" id="tb-${cid}">
        <input type="text" class="reel-type-input" id="ti-${cid}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí…" onkeydown="if(event.key==='Enter'){event.preventDefault();reelCheckType('${cid}')}">
        <div class="reel-accents">${ACCENT_CHARS.map(ch=>`<button type="button" class="accent-btn" onclick="insertAccent('ti-${cid}','${ch}')">${ch}</button>`).join('')}</div>
        <button class="r-check-btn" id="cb-${cid}" onclick="reelCheckType('${cid}')">Comprobar ✓</button>
      </div>`
    : `<div class="reel-opts">${c.opts.map(o=>`<button class="reel-opt" onclick="reelAnswer('${cid}',this,'${esc(o)}')">${o}</button>`).join('')}</div>`;
  return `<div class="reel" data-cid="${cid}" style="background:${c.bg}">
    <div class="reel-cat">${c.emoji} ${c.cat}</div>
    ${c.en?`<div class="reel-en">${c.en}</div>`:''}
    ${c.swatch?`<div class="reel-swatch" style="background:${c.swatch}"></div>`:''}
    ${promptHtml?`<div class="reel-prompt${c.big?' reel-big':''}">${promptHtml}</div>`:''}
    ${body}
    <div class="reel-fb" id="fb-${cid}"></div>
    <div id="spk-${cid}"></div>
    <div class="reel-up" id="up-${cid}">swipe up for more ⬆</div>
  </div>`;
}
function reelSpeakBtn(cid,es){
  if(!audioReady || !es) return '';
  let box=document.getElementById('spk-'+cid); if(!box) return '';
  box.innerHTML=`<button class="reel-speak" style="width:auto;height:auto;padding:8px 18px;font-size:15px;margin-top:14px;margin-bottom:0" onclick="speakEs('${jsEsc(es)}')">🔊 Escuchar</button>`;
}
function insertAccent(inputId,ch){
  let el=document.getElementById(inputId); if(!el||el.disabled) return;
  let s=el.selectionStart!=null?el.selectionStart:el.value.length, e=el.selectionEnd!=null?el.selectionEnd:el.value.length;
  el.value=el.value.slice(0,s)+ch+el.value.slice(e);
  el.focus(); el.setSelectionRange(s+ch.length,s+ch.length);
}
function reelCheckType(cid){
  let c=reelData[cid]; if(!c||c.done) return;
  let input=document.getElementById('ti-'+cid); if(!input || !input.value.trim()) { if(input) input.focus(); return; }
  c.done=true;
  let reel=document.querySelector(`.reel[data-cid="${cid}"]`);
  let val=input.value.trim(), exact=val===c.answer, good=norm(val)===norm(c.answer);
  input.disabled=true; let cb=document.getElementById('cb-'+cid); if(cb) cb.disabled=true;
  let box=document.getElementById('tb-'+cid); if(box) box.classList.add(good?'good':'bad');
  let fb=document.getElementById('fb-'+cid);
  if(good && exact) fb.textContent=rand(['¡Perfecto! 🎉','¡Exacto! ✨','¡Eso es! 🔥']);
  else if(good) fb.textContent='¡Casi! Ojo con el acento: '+c.answer+' ✏️';
  else fb.textContent='✗  '+c.answer;
  reelSpeakBtn(cid,c.es);
  srsGrade(c.srsId,good); bump(good);
  if(good){ reelXPFloat(); setTimeout(()=>reelNext(reel),1100); }
  else { document.getElementById('up-'+cid).classList.add('show'); }
}
function appendReels(n){
  let scroll=document.getElementById('reel-scroll'), html='';
  for(let i=0;i<n;i++){ let cid='r'+(reelIdx++); reelData[cid]=makeReelCard(); html+=reelCardHTML(cid,reelData[cid]); }
  scroll.insertAdjacentHTML('beforeend',html);
  scroll.querySelectorAll('.reel:not([data-obs])').forEach(el=>{ el.setAttribute('data-obs','1'); reelIO.observe(el); });
}
let sprintState=null, sprintTimer=null;
const SPRINT_SECONDS=60;
function startReels(mode){
  reelMode = mode==='grammar' ? 'grammar' : mode==='sprint' ? 'sprint' : 'vocab';
  sprintMode = reelMode==='sprint';
  let title = reelMode==='grammar' ? '⚡ Grammar Reels' : reelMode==='sprint' ? '🏃 Fluency Sprint' : '📚 Vocab Reels';
  let ov=$('#reels-overlay');
  let timerHTML = sprintMode ? `<div class="ra"><span class="ic">⏱️</span><span id="sprint-clock">${SPRINT_SECONDS}</span></div>` : '';
  ov.innerHTML=`
    <div class="reel-top"><div>${title}</div><button class="reel-x" onclick="exitReels()">✕</button></div>
    <div class="reel-rail">
      ${timerHTML}
      <div class="ra"><span class="ic">🔥</span><span id="reel-streak">${globalStreak}</span></div>
      <div class="ra"><span class="ic">⭐</span><span id="reel-xp">${xp}</span></div>
      <div class="ra" onclick="reelSkip()"><span class="ic">⏭️</span>skip</div>
    </div>
    <div class="reel-scroll" id="reel-scroll"></div>`;
  reelIdx=0; for(let k in reelData) delete reelData[k];
  reelIO=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting && e.intersectionRatio>=0.6){
      activeReelEl=e.target;
      let reels=[...document.querySelectorAll('.reel')];
      if(reels.indexOf(e.target)>=reels.length-2) appendReels(5);
    }});
  },{root:document.getElementById('reel-scroll'),threshold:[0.6]});
  ov.classList.add('on'); document.body.style.overflow='hidden';
  appendReels(6);
  if(sprintMode){
    sprintState={correct:0,total:0,timeLeft:SPRINT_SECONDS};
    if(sprintTimer) clearInterval(sprintTimer);
    sprintTimer=setInterval(tickSprint,1000);
  }
}
function tickSprint(){
  if(!sprintState) return;
  sprintState.timeLeft--;
  let clock=$('#sprint-clock'); if(clock) clock.textContent=Math.max(0,sprintState.timeLeft);
  if(sprintState.timeLeft<=0) endSprint();
}
function endSprint(){
  if(sprintTimer){ clearInterval(sprintTimer); sprintTimer=null; }
  sprintMode=false;
  let s=sprintState; if(!s) return;
  let acc = s.total ? Math.round(100*s.correct/s.total) : 0;
  let msg = acc>=85?'¡Impresionante velocidad! 🚀':acc>=60?'¡Muy bien! 💪':'¡Sigue practicando! 📈';
  let ov=$('#reels-overlay');
  ov.innerHTML=`
    <div class="reel-top"><div>🏃 Fluency Sprint</div><button class="reel-x" onclick="exitReels()">✕</button></div>
    <div class="reel-scroll">
      <div class="reel" style="height:100%;background:linear-gradient(160deg,#f7971e,#ffd200)">
        <div class="reel-cat">⏱️ Tiempo terminado</div>
        <div class="reel-prompt" style="font-size:26px">${msg}</div>
        <div style="font-size:56px;font-weight:800;margin-bottom:10px">${s.correct} / ${s.total}</div>
        <div style="font-size:18px;opacity:.9;margin-bottom:26px">${acc}% de precisión</div>
        <div class="reel-opts">
          <button class="reel-opt" onclick="startReels('sprint')">🔁 Otro sprint</button>
          <button class="reel-opt" onclick="exitReels()">✓ Terminar</button>
        </div>
      </div>
    </div>`;
  sprintState=null;
}
function exitReels(){
  let ov=$('#reels-overlay'); ov.classList.remove('on'); ov.innerHTML=''; document.body.style.overflow='';
  if(reelIO){reelIO.disconnect();reelIO=null;}
  if(sprintTimer){ clearInterval(sprintTimer); sprintTimer=null; }
  sprintMode=false; sprintState=null; activeReelEl=null; renderHome(); go('home');
}
function reelNext(reel){ let nx=reel&&reel.nextElementSibling; if(nx) nx.scrollIntoView({behavior:'smooth'}); }
function reelSkip(){ if(activeReelEl) reelNext(activeReelEl); }
function reelXPFloat(){ let ov=$('#reels-overlay'); let f=document.createElement('div'); f.className='reel-xpfloat'; f.textContent='+10'; ov.appendChild(f); setTimeout(()=>f.remove(),1000); }
function reelAnswer(cid,btn,val){
  let c=reelData[cid]; if(!c||c.done) return; c.done=true;
  let reel=document.querySelector(`.reel[data-cid="${cid}"]`), good=val===c.answer;
  reel.querySelectorAll('.reel-opt').forEach(b=>{ if(b.textContent===c.answer)b.classList.add('correct'); else if(b===btn)b.classList.add('wrong'); b.disabled=true; });
  let blank=reel.querySelector('.reel-blank'); if(blank)blank.textContent=c.answer;
  let fb=document.getElementById('fb-'+cid); fb.textContent = good ? rand(['¡Correcto! 🎉','¡Exacto! ✨','¡Eso es! 🔥','¡Muy bien! 👏']) : '✗  '+c.answer;
  if(sprintState){ sprintState.total++; if(good) sprintState.correct++; }
  else reelSpeakBtn(cid,c.es);
  srsGrade(c.srsId,good); bump(good);
  if(sprintState){ setTimeout(()=>reelNext(reel),good?450:650); }
  else if(good){ reelXPFloat(); setTimeout(()=>reelNext(reel),850); }
  else { document.getElementById('up-'+cid).classList.add('show'); }
}
document.addEventListener('keydown',e=>{
  if(!$('#reels-overlay').classList.contains('on')) return;
  if(document.activeElement && document.activeElement.tagName==='INPUT') return; // typing — don't steal keys
  if(e.key==='ArrowDown'){ e.preventDefault(); reelSkip(); }
  else if(['1','2','3','4'].includes(e.key)){ let opts=activeReelEl&&activeReelEl.querySelectorAll('.reel-opt'); let i=+e.key-1; if(opts&&opts[i]&&!opts[i].disabled) opts[i].click(); }
});

/* ============ INIT ============ */
buildPools();
loadClozeData();
renderHome();
</script>
