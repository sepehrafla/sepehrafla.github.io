<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#17191d">
    <meta name="description" content="WHY? — a physics motorbike game about curiosity.">
    <title>WHY? — Follow the glow</title>
  </head>
  <body>
    <main id="game" aria-label="WHY?, a physics motorbike game">
      <section id="title" class="title">
        <div class="scenery" aria-hidden="true">
          <span class="sky"></span>
          <svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
            <path class="hill h3" d="M0,296 C150,258 300,290 450,264 S750,254 900,274 S1150,248 1200,266 L1200,400 L0,400 Z"/>
            <path class="hill h2" d="M0,330 C180,300 340,340 520,314 S820,320 1000,300 S1160,314 1200,304 L1200,400 L0,400 Z"/>
            <g class="ridebike"><circle cx="-15" cy="-9" r="9"/><circle cx="15" cy="-9" r="9"/><path d="M-15,-9 L-7,-21 L7,-23 L15,-9 L5,-16 L-5,-15 Z"/><path d="M-3,-23 l5,-12 l7,1 l-3,12 z"/><circle cx="5" cy="-40" r="5.5"/></g>
            <path class="hill h1" d="M0,368 C200,348 380,378 560,358 S880,368 1060,350 S1180,362 1200,356 L1200,400 L0,400 Z"/>
          </svg>
          <span class="glow"></span>
        </div>
        <h1>WHY?</h1>
        <div class="keys" aria-hidden="true"><i>←</i><i>↑</i><i>→</i><i>↓</i></div>
        <div class="modes"><button id="ride" aria-label="Start freeride">∞</button><button id="daily" aria-label="Start daily ride">◷</button></div>
      </section>
      <button id="end" class="end" aria-label="End ride">■</button>
      <div id="hud" class="hud"><b id="sparks">0 ✦</b><span id="distance">0000</span><span id="timer"></span></div>
      <div id="speedometer" class="speedometer" aria-label="Speed: 0 kilometers per hour">
        <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M12 51a38 38 0 0 1 76 0"/></svg>
        <i aria-hidden="true"></i><strong id="speed-value">0</strong><small>KM/H</small>
      </div>
      <div class="vignette" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
      <div class="touch" aria-hidden="true"><i>↶</i><i>↷</i><i>◼</i><i>▲</i></div>
      <section id="map" class="map"><canvas id="map-canvas" width="1080" height="640"></canvas><div><button id="keep" aria-label="Keep route map">⇩</button><button id="again" aria-label="Ride again">↻</button></div></section>
      <p id="fallback" class="fallback"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
