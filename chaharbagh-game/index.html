<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a1a22">
  <meta name="description" content="Chaharbagh — a physics-driven playable Persian miniature.">
  <title>Chaharbagh — A Physics-Driven Playable Essay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@500;650&display=swap" rel="stylesheet">
</head>
<body>
  <main id="game" aria-label="Chaharbagh, a physics-driven Persian garden">
    <div class="grain" aria-hidden="true"></div>
    <div class="border" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="ink" id="ink" aria-hidden="true"></div>
    <section class="opening" id="opening">
      <span>چهارباغ</span><h1>Chaharbagh</h1><p>A garden moved by weight, chance, and your hand.</p>
      <button id="enter" type="button">Enter the garden</button>
    </section>
    <blockquote id="quote" aria-live="polite"></blockquote>
    <div class="action-pulse" id="action-pulse" aria-hidden="true"></div>
    <section class="finale" id="finale">
      <div><span>چهارباغ</span><h2>Chaharbagh</h2><p>“What you seek is seeking you.”</p><button id="keep" type="button">Keep this painting</button><button class="quiet" id="again" type="button">Begin another garden</button></div>
    </section>
    <p class="fallback" id="fallback"></p>
  </main>
  <script type="module" src="/src/main.ts"></script>

</html>
